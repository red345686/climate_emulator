[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-emulator"
version = "0.1.0"
description = "ClimateBench v1 emissions-support extrapolation experiments"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
neural = ["tensorflow==2.15.1", "keras==2.15.0"]
gp = ["tensorflow==2.15.1", "keras==2.15.0", "gpflow==2.9.2", "tensorflow-probability==0.23.0"]
test = ["pytest==8.3.2"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neural: requires TensorFlow", "gp: requires GPflow"]
